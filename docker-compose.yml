version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: shrivox-console-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shrivox_console
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: shrivox-console-redis
    restart: unless-stopped
    ports:
      - "6379:6379"